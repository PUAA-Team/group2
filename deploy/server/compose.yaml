name: model-platform

x-control: &control
  image: model-platform-control:${RELEASE_ID:?set RELEASE_ID}
  build:
    context: ../..
    dockerfile: deploy/server/Dockerfile
  environment:
    MT_DATABASE_PASSWORD: ${MT_DATABASE_PASSWORD:?set application database password}
    MT_ALLOWED_ORIGINS: ${MT_PUBLIC_ORIGIN:?set public origin}
    MT_SECURE_COOKIE: ${MT_SECURE_COOKIE:?set cookie policy}
  volumes:
    - ${RUNTIME_DIR:?set runtime directory}/app:/runtime
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: &logging
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set administration database password}
      MT_DATABASE_PASSWORD: ${MT_DATABASE_PASSWORD:?set application database password}
    volumes:
      - ${RUNTIME_DIR}/postgres:/var/lib/postgresql/data
      - ./init-database.sh:/docker-entrypoint-initdb.d/01-application.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    <<: *control
    command: [migrate]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *control
    command: [serve]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s

  operations:
    <<: *control
    command: [operations]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_PORT:-5488}:8080"
    volumes:
      - ${GATEWAY_CONFIG:?select nginx configuration}:/etc/nginx/conf.d/default.conf:ro
      - ${RUNTIME_DIR}/certificates:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
