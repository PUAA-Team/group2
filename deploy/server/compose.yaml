name: model-platform

x-control: &control
  image: ${CONTROL_IMAGE:-model-platform-control}:${RELEASE_ID:?set RELEASE_ID}
  build:
    context: ../..
    dockerfile: deploy/server/Dockerfile
  environment:
    MT_DATABASE_PASSWORD: ${MT_DATABASE_PASSWORD:?set application database password}
    MT_ALLOWED_ORIGINS: ${MT_PUBLIC_ORIGIN:?set public origin}
    MT_SECURE_COOKIE: ${MT_SECURE_COOKIE:?set cookie policy}
    MT_ALLOW_BROWSER_SETUP: ${MT_ALLOW_BROWSER_SETUP:-0}
  volumes:
    - ${RUNTIME_DIR:?set runtime directory}/app:/runtime
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: &logging
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    # 最小能力：官方 postgres 镜像入口需 chown 数据目录并以 gosu 切到
    # postgres 用户，保留 CHOWN / DAC_OVERRIDE / SETGID / SETUID 即可；
    # 5432 > 1024，不需要 NET_BIND_SERVICE。
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set administration database password}
      MT_DATABASE_PASSWORD: ${MT_DATABASE_PASSWORD:?set application database password}
    volumes:
      - ${RUNTIME_DIR}/postgres:/var/lib/postgresql/data
      - ./init-database.sh:/docker-entrypoint-initdb.d/01-application.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    <<: *control
    command: [migrate]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *control
    command: [serve]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s

  operations:
    <<: *control
    command: [operations]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s

  gateway:
    # 固定到当前稳定版，避免 stable-alpine 浮动标签悄悄升级。
    image: nginx:1.30.8-alpine
    restart: unless-stopped
    # 最小能力：nginx 以 root 启动 master 再 setuid 到 nginx 用户。
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_PORT:-5488}:8080"
    environment:
      # 证书目录名（TLS_IP）由官方 nginx 镜像入口经 envsubst 写入模板；
      # 模板里的 $http_host 等 nginx 变量不在环境变量表里，不会被替换。
      TLS_IP: ${TLS_IP:?set TLS IP or hostname}
    volumes:
      - ${GATEWAY_CONFIG:?select nginx configuration}:/etc/nginx/templates/default.conf.template:ro
      - ${RUNTIME_DIR}/certificates:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 经网关本身探测 /readyz：网关能反代才算健康；无服务依赖网关，
      # api 异常时只影响网关自身的健康状态，不会级联停掉其他服务。
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *logging
